x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the production environment file}
  GOOGLE_TRENDS_RSS_URL: https://trends.google.com/trending/rss?geo=KR
  WIKIMEDIA_API_URL: https://wikimedia.org/api/rest_v1
  WIKIDATA_API_URL: https://www.wikidata.org/w/api.php
  GEEKNEWS_RSS_URL: https://news.hada.io/rss/news
  USER_AGENT: ${USER_AGENT:?set a contact-bearing USER_AGENT}
  DASHBOARD_HOST: 127.0.0.1
  DASHBOARD_ALLOW_PUBLIC: "false"
  PUBLICATION_POLICY_MODE: MANUAL_APPROVAL_REQUIRED
  DEMO_MODE_ENABLED: "false"
  META_PROVIDER_ENABLED: "false"
  LLM_PROVIDER_ENABLED: "false"
  SECURE_SESSION_COOKIE: "true"

x-app-image: &app-image
  image: mzapp:${APP_IMAGE_TAG:-latest}
  build:
    context: .
  environment: *app-environment

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trend_radar}
      POSTGRES_USER: ${POSTGRES_USER:-trend_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    <<: *app-image
    restart: "no"
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: [*app-image, *service-defaults]
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${INTERNAL_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: [*app-image, *service-defaults]
    profiles: ["scheduler"]
    environment:
      <<: *app-environment
      POC_START_DATE: ${POC_START_DATE:?set POC_START_DATE}
    command:
      - sh
      - -c
      - exec .venv/bin/python scripts/scheduler.py --mode intelligence-only --poc-start "$${POC_START_DATE}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    environment:
      TREND_RADAR_DOMAIN: ${TREND_RADAR_DOMAIN:?set TREND_RADAR_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
