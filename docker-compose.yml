services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trend_radar
      POSTGRES_USER: trend_radar
      POSTGRES_PASSWORD: trend_radar
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_radar -d trend_radar"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - trend-radar-postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://trend_radar:trend_radar@db:5432/trend_radar
      # The published port below is host-loopback-only, so the dashboard stays in local mode.
      DASHBOARD_HOST: 127.0.0.1
      DASHBOARD_ALLOW_PUBLIC: "false"
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://trend_radar:trend_radar@db:5432/trend_radar
      POC_START_DATE: ${POC_START_DATE:-2026-09-20}
      META_PROVIDER_ENABLED: "false"
      LLM_PROVIDER_ENABLED: "false"
    command:
      - sh
      - -c
      - uv run --no-sync python scripts/scheduler.py --poc-start "$${POC_START_DATE}"
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

volumes:
  trend-radar-postgres:
